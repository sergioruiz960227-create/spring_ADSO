# ============================================================
# Configuración de la aplicación - Módulo de usuarios (Spring Boot)
# ============================================================

# Nombre de la aplicación (aparece en los registros de la consola)
spring.application.name=spring_ADSO

# ------------------------------------------------------------
# Conexión a la base de datos MySQL
# ------------------------------------------------------------

# Dirección de la base de datos: servidor (localhost), puerto (3306) y nombre (spring_ADSO).
# useUnicode y characterEncoding=utf8: permiten guardar tildes y la letra ñ.
# createDatabaseIfNotExist=true: crea la base de datos si todavía no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ADSO?useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true

# Usuario de MySQL (root es el usuario por defecto de XAMPP)
spring.datasource.username=root

# Contraseña de MySQL (vacía en XAMPP por defecto)
spring.datasource.password=

# ------------------------------------------------------------
# Configuración de JPA / Hibernate
# ------------------------------------------------------------

# update: Hibernate crea las tablas que no existan y ajusta las que cambien,
# sin borrar los datos que ya están guardados.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las sentencias SQL que Hibernate ejecuta (útil para aprender y depurar)
spring.jpa.show-sql=true

# ------------------------------------------------------------
# Herramientas de desarrollo
# ------------------------------------------------------------

# Reinicia la aplicación automáticamente cuando se modifica el código
spring.devtools.restart.enabled=true
